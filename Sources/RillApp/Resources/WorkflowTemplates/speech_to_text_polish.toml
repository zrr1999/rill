# Rill workflow schema v1: Speech to Text with an LLM polish step
# Change `id` before keeping more than one copy of this template.

schema_version = 1
enabled = true
id = "D0000000-0000-4000-8000-000000000003"
name = "Polish"
trigger = "manual"

[ui]
symbol = "wand.and.stars"
accent = "purple"

[setup.speech]
selection = "fixed"
recognizer = "local-speech"
local_model = "qwen3-asr-0.6b-mlx-8bit"
live_preview = true
streaming_profile = "realtime"

[[process]]
id = "D0000000-0000-4000-8000-000000000301"
kind = "recognize-speech"

[[process]]
id = "D0000000-0000-4000-8000-000000000302"
kind = "apply-vocabulary"

[[process]]
id = "D0000000-0000-4000-8000-000000000303"
kind = "normalize-whitespace"

[[process]]
id = "D0000000-0000-4000-8000-000000000304"
kind = "llm-rewrite"
prompt = "Polish into a concise final message while preserving meaning and language."

[output]
strategy = "stack-first"

[[output.actions]]
id = "stack.push"

[metadata]
"workflow.origin" = "user"
