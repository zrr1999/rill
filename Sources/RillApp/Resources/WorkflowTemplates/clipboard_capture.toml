# Rill workflow schema v1: Capture into the Voice clipboard group
# Change `id` before keeping more than one copy of this template.

schema_version = 1
enabled = true
id = "D0000000-0000-4000-8000-000000000002"
name = "Clipboard Capture"
trigger = "manual"

[ui]
symbol = "tray.and.arrow.down.fill"
accent = "blue"

[setup.speech]
selection = "automatic"
recognizer = "local-speech"
local_model = "qwen3-asr-0.6b-mlx-8bit"

[[process]]
id = "D0000000-0000-4000-8000-000000000201"
kind = "recognize-speech"

[[process]]
id = "D0000000-0000-4000-8000-000000000202"
kind = "apply-vocabulary"

[[process]]
id = "D0000000-0000-4000-8000-000000000203"
kind = "normalize-whitespace"

[output]
strategy = "stack-first"

[[output.actions]]
id = "stack.push"

[metadata]
"workflow.origin" = "user"
"clipboard.target-group-id" = "4C5A3D00-90E6-4BA0-95D7-17E8B6DA0002"
