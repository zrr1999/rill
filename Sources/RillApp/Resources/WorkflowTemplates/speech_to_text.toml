# Rill workflow v1: Speech to Text
# Change `id` before keeping more than one copy of this template.

format = "rill.workflow"
version = 1
enabled = false
id = "D0000000-0000-4000-8000-000000000001"
name = "Speech to Text"

[trigger]
kind = "hotkey"
gesture = "control-option-shift-space"

[input]
kind = "audio"

[ui]
symbol = "mic.fill"
accent = "red"

[setup.speech]
live_preview = true
streaming_profile = "realtime"

[[process]]
id = "D0000000-0000-4000-8000-000000000101"
kind = "recognize-speech"
record_duration = true

[[process]]
id = "D0000000-0000-4000-8000-000000000102"
kind = "apply-vocabulary"

[[process]]
id = "D0000000-0000-4000-8000-000000000103"
kind = "normalize-whitespace"

[output]
strategy = "immediate"

[[output.actions]]
id = "store"
kind = "record.store"
collections = ["4C5A3D00-90E6-4BA0-95D7-17E8B6DA0002"]

[[output.actions]]
id = "deliver"
kind = "focused-application.insert"
optional = true
