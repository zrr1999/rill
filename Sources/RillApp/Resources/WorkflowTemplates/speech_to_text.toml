# Rill workflow schema v2: Speech to Text
# Change `id` before keeping more than one copy of this template.

schema_version = 2
enabled = false
id = "D0000000-0000-4000-8000-000000000001"
name = "Speech to Text"

[trigger]
kind = "hotkey"
gesture = "control-option-shift-space"

[input]
kind = "audio"

[ui]
symbol = "mic.fill"
accent = "red"

[setup.speech]
selection = "fixed"
recognizer = "local-speech"
live_preview = true
streaming_profile = "realtime"

[[process]]
id = "D0000000-0000-4000-8000-000000000101"
kind = "recognize-speech"

[[process]]
id = "D0000000-0000-4000-8000-000000000102"
kind = "apply-vocabulary"

[[process]]
id = "D0000000-0000-4000-8000-000000000103"
kind = "normalize-whitespace"

[output]
strategy = "immediate"

[[output.actions]]
id = "store"
kind = "record.store"

[[output.actions]]
id = "deliver"
kind = "focused-application.insert"

[options]
"record.target-collection-ids" = "4C5A3D00-90E6-4BA0-95D7-17E8B6DA0002"

[metadata]
"workflow.origin" = "user"
