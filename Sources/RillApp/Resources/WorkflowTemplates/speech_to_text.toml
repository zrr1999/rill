# Rill workflow schema v1: Speech to Text
# Change `id` before keeping more than one copy of this template.

schema_version = 1
enabled = true
id = "D0000000-0000-4000-8000-000000000001"
name = "Speech to Text"
trigger = "hotkey"

[ui]
symbol = "mic.fill"
accent = "red"

[setup.speech]
selection = "automatic"
recognizer = "sherpa-onnx.local"

[[process]]
id = "D0000000-0000-4000-8000-000000000101"
kind = "recognize-speech"

[[process]]
id = "D0000000-0000-4000-8000-000000000102"
kind = "apply-vocabulary"

[[process]]
id = "D0000000-0000-4000-8000-000000000103"
kind = "normalize-whitespace"

[output]
strategy = "immediate"

[[output.actions]]
id = "inject.text"

[metadata]
"workflow.origin" = "user"
"trigger.gesture" = "control-option-shift-space"
