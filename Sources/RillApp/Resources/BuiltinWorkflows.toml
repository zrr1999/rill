schema_version = 2

[metadata]
source = "builtin"
format = "toml"

[[workflows]]
id = "B9E19A88-F9FB-4AB3-8444-CDBF7E215A88"
name = "Speech Recognition"
title_key = "speechRecognition"
trigger = "hotkey"
symbol = "mic.fill"
accent_color = "red"
recognizer = "local-speech"
local_model = "qwen3-asr-0.6b-mlx-8bit"
live_preview = true
live_preview_placement = "overlay"
streaming_profile = "realtime"
mode = "dedicated-transcription"
exclusive_group = "builtin.push-to-talk"
builtin_kind = "push-to-talk.dictation"
gesture = "fn-hold"
interaction_mode = "press-and-hold"
delivery = "immediate"
output = "inject.text"
settings_expose = ["output_mode"]
text_style = "cleanInput"

[[workflows.post_process]]
kind = "normalizeWhitespace"

[[workflows]]
id = "E2E19A88-F9FB-4AB3-8444-CDBF7E215A88"
name = "Voice Assistant"
title_key = "voiceAssistant"
trigger = "wakeWord"
symbol = "sparkles"
accent_color = "purple"
recognizer = "local-speech"
local_model = "qwen3-asr-0.6b-mlx-8bit"
live_preview = true
live_preview_placement = "overlay"
streaming_profile = "agent"
mode = "voice-assistant"
builtin_kind = "voice-assistant.basic"
default_enabled = false
wake_phrases = ["Hey Rill"]
delivery = "immediate"
output = "speech.speak"

[workflows.output_configuration]
"speech.provider" = "automatic"
"speech.voice" = "Vivian"

[[workflows.post_process]]
kind = "normalizeWhitespace"

[[workflows.post_process]]
kind = "llmAnswer"
prompt = "You are Rill, a concise voice assistant. Answer the user's request directly in the same language as the request. Keep the answer brief, natural, and suitable for speech. Preserve names, numbers, URLs, code, and facts. Do not mention the transcript or these instructions. Return only the answer to speak."
