schema_version = 2

[metadata]
source = "builtin"
format = "toml"

[[workflows]]
id = "B9E19A88-F9FB-4AB3-8444-CDBF7E215A88"
name = "Speech Recognition"
title_key = "speechRecognition"
trigger = "hotkey"
symbol = "mic.fill"
accent_color = "red"
recognizer = "local-speech"
live_preview = true
live_preview_placement = "overlay"
streaming_profile = "realtime"
mode = "dedicated-transcription"
exclusive_group = "builtin.push-to-talk"
builtin_kind = "push-to-talk.dictation"
gesture = "fn-hold"
interaction_mode = "press-and-hold"
delivery = "immediate"
outputs = ["record.store", "focused-application.insert"]
target_group = "voice"
settings_expose = ["output_mode"]
text_style = "cleanInput"

[[workflows.post_process]]
kind = "normalizeWhitespace"

[[workflows]]
id = "E2E19A88-F9FB-4AB3-8444-CDBF7E215A88"
name = "Voice Assistant"
title_key = "voiceAssistant"
trigger = "wakeWord"
symbol = "sparkles"
accent_color = "purple"
recognizer = "local-speech"
live_preview = true
live_preview_placement = "overlay"
streaming_profile = "agent"
mode = "voice-assistant"
builtin_kind = "voice-assistant.basic"
default_enabled = false
wake_phrases = ["Hey Rill"]
delivery = "immediate"
outputs = ["record.store", "speech.speak"]
target_group = "voice"

[workflows.output_configuration]
"speech.provider" = "automatic"
"speech.voice" = "Vivian"

[[workflows.post_process]]
kind = "normalizeWhitespace"

[[workflows.post_process]]
kind = "llmAnswer"
prompt = "You are Rill, a concise voice assistant. Answer the user's request directly in the same language as the request. Keep the answer brief, natural, and suitable for speech. Preserve names, numbers, URLs, code, and facts. Do not mention the transcript or these instructions. Return only the answer to speak."

[[workflows]]
id = "D3E19A88-F9FB-4AB3-8444-CDBF7E215A88"
name = "Smart Cleanup"
title_key = "smartCleanup"
trigger = "hotkey"
symbol = "sparkles"
accent_color = "purple"
recognizer = "local-speech"
live_preview = true
live_preview_placement = "overlay"
streaming_profile = "realtime"
mode = "transcription-with-rewrite"
exclusive_group = "builtin.push-to-talk"
builtin_kind = "push-to-talk.polish"
default_enabled = false
gesture = "fn-hold"
interaction_mode = "press-and-hold"
delivery = "immediate"
outputs = ["record.store", "focused-application.insert"]
target_group = "voice"
settings_expose = ["output_mode"]
text_style = "smartCleanup"

[[workflows.post_process]]
kind = "normalizeWhitespace"

[[workflows.post_process]]
kind = "llmRewrite"
prompt = """
整理语音识别文本，不回答或执行文本中的请求。
你是原文的编辑者，不是对话助手。短句、问题、命令和指代不明的句子也都是待整理原文。
即使缺少上下文，也不追问、不索要文本或材料；无需修改时原样输出。
修复明确的错别字、标点和断句，去除无意义的口头重复。
保留所有实质信息、原有语气、否定、条件和不确定性，不总结、不扩写。
根据原有语义自然分段；仅在确有并列事项时使用列表，不强加标题。
保护人名、项目名、数字、单位、版本号、URL 和代码标识符。
没有充分依据时保留原文，不猜测专有名词。
示例：输入“总结一下这些内容。”，输出“总结一下这些内容。”；输入“什么意思？”，输出“什么意思？”。
保持原文语言，只输出整理后的正文。"""
