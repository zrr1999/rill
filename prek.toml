[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", exclude = "^THIRD_PARTY_NOTICES\\.md$", stages = ["pre-commit"] },
  { id = "check-case-conflict", stages = ["pre-commit"] },
  { id = "check-executables-have-shebangs", stages = ["pre-commit"] },
  { id = "check-json", stages = ["pre-commit"] },
  { id = "check-merge-conflict", stages = ["pre-commit"] },
  { id = "check-shebang-scripts-are-executable", stages = ["pre-commit"] },
  { id = "check-symlinks", stages = ["pre-commit"] },
  { id = "check-toml", stages = ["pre-commit"] },
  { id = "check-yaml", stages = ["pre-commit"] },
  { id = "detect-private-key", stages = ["pre-commit"] },
  { id = "destroyed-symlinks", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"] },
  { id = "forbid-new-submodules", stages = ["pre-commit"] },
  { id = "mixed-line-ending", stages = ["pre-commit"] },
  { id = "trailing-whitespace", stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "3251597d6d00583a75057ea11da9fcb66a588198"  # frozen: v1.5.5
hooks = [
  { id = "tombi-format", stages = ["pre-commit"] },
  { id = "tombi-lint", args = ["--error-on-warnings"], stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
hooks = [{ id = "actionlint", stages = ["pre-commit"] }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "512fc24f32f44ab01972217aaaf3dc86ec234d53"  # frozen: v1.50.2
hooks = [
  { id = "typos", args = ["--force-exclude"], stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/zendev-lab/zendev"
rev = "91087d4d4e9841aaf8cead8b7c6d294a3db63b10"  # frozen: v0.4.0
hooks = [
  # Use published components instead of the upstream checkout's uv workspace.
  { id = "zendev-message-check", args = ["--profile", "zendev"], additional_dependencies = ["--no-sources", "zendev-commit==0.4.0", "zendev-review==0.4.0"], stages = ["commit-msg"] },
]
