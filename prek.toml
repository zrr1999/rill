default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", exclude = "^(THIRD_PARTY_NOTICES\\.md|Sources/RillUI/Resources/Localizable\\.xcstrings)$", stages = ["pre-commit"] },
  # Xcode catalogs retain both translations and per-string metadata.
  { id = "check-added-large-files", name = "check string catalog size", files = "^Sources/RillUI/Resources/Localizable\\.xcstrings$", args = ["--maxkb=1024"], stages = ["pre-commit"] },
  { id = "check-case-conflict", stages = ["pre-commit"] },
  { id = "check-executables-have-shebangs", stages = ["pre-commit"] },
  { id = "check-json", stages = ["pre-commit"] },
  { id = "check-merge-conflict", stages = ["pre-commit"] },
  { id = "check-shebang-scripts-are-executable", stages = ["pre-commit"] },
  { id = "check-symlinks", stages = ["pre-commit"] },
  { id = "check-toml", stages = ["pre-commit"] },
  { id = "check-yaml", stages = ["pre-commit"] },
  { id = "detect-private-key", stages = ["pre-commit"] },
  { id = "destroyed-symlinks", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", args = ["--check"], stages = ["pre-commit"] },
  { id = "forbid-new-submodules", stages = ["pre-commit"] },
  { id = "mixed-line-ending", args = ["--fix=no"], stages = ["pre-commit"] },
  { id = "trailing-whitespace", args = ["--check"], stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "d89e7f1227a0574e4bd50f58c7ac72b08b245e04"  # frozen: v1.9.0
hooks = [
  { id = "tombi-format", args = ["--check"], stages = ["pre-commit"] },
  { id = "tombi-lint", args = ["--error-on-warnings"], stages = ["pre-commit"] },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "jactionlint",
    name = "GitHub Actions correctness and security",
    entry = "bash scripts/check_workflows.sh --no-online",
    language = "python",
    additional_dependencies = ["jactionlint==2.3.0", "shellcheck-py==0.11.0.1", "pyflakes==3.4.0"],
    pass_filenames = false,
    files = '^(\.github/|(.*/)?action\.ya?ml$|prek\.toml$|scripts/check_workflows\.sh$)',
    stages = ["pre-commit"],
  },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "a6564f5d57444e123433a5c9af733e3975c77229"  # frozen: v0.11.0.1-1
hooks = [{ id = "shellcheck", stages = ["pre-commit"] }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "7f9d0819ca1c008ade73f4b41fa9d258d48f605b"  # frozen: v1.51.1
hooks = [
  { id = "typos", args = ["--force-exclude"], stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/zendev-lab/zendev"
rev = "66d020624b6d3e318c3e5c26acab29458998b74d"  # frozen: v0.6.0
hooks = [
  { id = "zendev-message-fix", stages = ["commit-msg"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "38bfb07c0c64c304f47eb52090f8288150c77730"  # frozen: v0.17.1
hooks = [
  { id = "ruff-check", args = ["--no-fix", "--config", "tools/pyproject.toml"], files = "^tools/.*\\.py$", stages = ["pre-commit"] },
  { id = "ruff-format", args = ["--check", "--config", "tools/pyproject.toml"], files = "^tools/.*\\.py$", stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/apple/swift-format"
rev = "15d7877c6b32926948f6520f0156657945955ea3"  # frozen: 604.0.0
hooks = [
  { id = "swift-format", args = ["--configuration", ".swift-format"], stages = ["manual"] },
  { id = "swift-format-lint", args = ["--configuration", ".swift-format"], stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.31.1"
hooks = [
  { id = "zizmor", args = ["--offline", "--strict-collection", "--min-severity=medium"], stages = ["pre-commit"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "deptry", name = "Python dependency ownership", entry = "uv run --directory tools --frozen deptry src", language = "system", pass_filenames = false, files = "^tools/(src/|pyproject\\.toml$|uv\\.lock$)", stages = ["pre-commit"] },
  { id = "import-linter", name = "Evaluation module boundaries", entry = "uv run --directory tools --frozen lint-imports", language = "system", pass_filenames = false, files = "^tools/(src/|pyproject\\.toml$)", stages = ["pre-commit"] },
  { id = "ast-grep", name = "Domain preferences boundary", entry = "ast-grep scan", language = "python", additional_dependencies = ["ast-grep-cli==0.51.0"], pass_filenames = false, files = "(\\.swift$|^scripts/ast-grep\\.yml$|^sgconfig\\.yml$)", stages = ["pre-commit"] },
  { id = "ast-grep-tests", name = "Structure rule examples", entry = "ast-grep test --skip-snapshot-tests", language = "python", additional_dependencies = ["ast-grep-cli==0.51.0"], pass_filenames = false, files = "(^scripts/ast-grep\\.yml$|^tools/tests/ast-grep\\.yml$|^sgconfig\\.yml$)", stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "033aa05ea3f6f5f7cd39bcb6a31fd66f6efbed2f"  # frozen: v0.0.89
hooks = [
  { id = "ty", args = ["--project", "tools", "--locked"], files = "^tools/(src/.*\\.py|pyproject\\.toml|uv\\.lock)$", always_run = false, stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.39.0"
hooks = [
  { id = "check-jsonschema", alias = "renovate-schema", name = "Renovate configuration schema", files = "^\\.github/renovate\\.json$", stages = ["pre-commit"], args = ["--builtin-schema", "vendor.renovate"] },
]

[[repos]]
repo = "https://github.com/semgrep/pre-commit"
rev = "v1.182.1"
hooks = [
  { id = "semgrep", name = "Private evaluation file permissions", language_version = "python3.13", pass_filenames = false, files = "(^tools/src/.*\\.py$|^\\.semgrep\\.yml$)", stages = ["pre-commit"], args = ["scan", "--config", ".semgrep.yml", "--metrics=off", "--error", "tools/src"] },
  { id = "semgrep", alias = "semgrep-tests", name = "Security rule examples", language_version = "python3.13", pass_filenames = false, files = "(^tools/tests/semgrep_privacy\\.py$|^\\.semgrep\\.yml$)", stages = ["pre-commit"], args = ["--test", "--config", ".semgrep.yml", "tools/tests/semgrep_privacy.py", "--metrics=off"] },
]

[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.25.1"
hooks = [
  { id = "vale", name = "Documentation terminology", require_serial = true, types = ["markdown"], stages = ["pre-commit"], args = [] },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.0"
hooks = [
  { id = "rumdl-check", alias = "rumdl", name = "Markdown structure", types = ["markdown"], stages = ["pre-commit"], args = [] },
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"
hooks = [
  { id = "shfmt", name = "Shell script formatting", types = ["shell"], stages = ["pre-commit"], args = ["-d", "-i", "2", "-bn"] },
]
