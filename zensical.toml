[project]
site_name = "Rill"
site_description = "macOS 语音输入、Record 与可配置工作流"
repo_url = "https://github.com/zrr1999/rill"
repo_name = "zrr1999/rill"
edit_uri = "edit/main/"
docs_dir = ".artifacts/docs/source"
site_dir = ".artifacts/docs/site"
strict = true
nav = [
  { "使用指南" = "README.md" },
  { "开发" = [
    { "贡献指南" = "CONTRIBUTING.md" },
    { "架构与状态归属" = "docs/architecture.md" },
    { "Record 存储与交付" = "docs/record-architecture.md" },
    { "工作流 TOML" = "docs/workflow-toml.md" },
    { "上下文纠错" = "docs/contextual-correction.md" },
    { "界面方向" = "docs/ui-direction.md" },
    { "图标设计" = "docs/icon-design.md" },
    { "构建性能" = "docs/build-performance.md" },
  ] },
  { "维护" = [
    { "发布步骤" = "docs/releasing.md" },
    { "发布验收" = "docs/release-qa-checklist.md" },
    { "文档站" = "docs/documentation.md" },
  ] },
  { "隐私与许可" = [
    { "隐私与数据流" = "PRIVACY.md" },
    { "安全报告" = "SECURITY.md" },
    { "第三方依赖" = "THIRD_PARTY_NOTICES.md" },
    { "本地模型" = "LOCAL_MODEL_NOTICES.md" },
  ] },
]

[project.extra]
# Sources outside the navigation that must also be available in the site.
docs_assets = [
  "LICENSE",
  "docs/assets/rill-icon-family.png",
  "docs/examples/conditional-workflow.toml",
  "docs/schemas/workflow-v2.schema.json",
]

[project.theme]
language = "zh"
font = false
features = [
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换至深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "切换至浅色模式"

[project.markdown_extensions]
tables = {}
toc.permalink = true
toc.slugify.object = "pymdownx.slugs.slugify"
toc.slugify.kwds.case = "lower"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true
