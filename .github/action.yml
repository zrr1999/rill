name: Audit locked dependencies
description: Check the locked Swift and Python dependencies and upload the OSV report.
runs:
  using: composite
  steps:
    - name: Install locked development tools
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: "2026.11.12"

    - name: Restore Python and hook caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .artifacts/uv-cache
          .artifacts/prek-cache
        key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

    - name: Audit locked Swift and Python dependencies
      shell: bash
      run: mise run audit:dependencies
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: dependency-audit
        path: .artifacts/quality/dependency-osv.json
        include-hidden-files: true
        if-no-files-found: error
