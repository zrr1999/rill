name: "CI - Static Checks"

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
    types:
      - checks_requested

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/uv-cache
  PREK_HOME: ${{ github.workspace }}/.artifacts/prek-cache

permissions:
  contents: read

concurrency:
  group: ci-static-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install locked development tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: "2026.11.12"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Build documentation and validate Cloudflare static assets
        run: |
          mise run docs
          npx --yes --ignore-scripts wrangler@4.136.3 deploy --dry-run

      - name: Run repository quality gates
        run: mise run check

      - name: Scan secrets
        run: bash scripts/check_secrets.sh

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.language == 'swift' && 90 || 45 }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build: none
          - language: python
            os: ubuntu-latest
            build: none
          - language: c-cpp
            os: ubuntu-latest
            build: none
          - language: swift
            os: macos-26
            build: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked development tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        if: matrix.language == 'swift'
        with:
          version: "2026.11.12"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.language == 'swift'
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Resolve locked packages before tracing
        if: matrix.language == 'swift'
        run: |
          swift package --scratch-path .artifacts/build/codeql --force-resolved-versions resolve
          git diff --exit-code -- Package.resolved
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          config: |
            paths-ignore:
              - tools/tests/semgrep_privacy.py
              - Sources/CRime/include/rime_api.h
              - Sources/CRime/include/rime_api_deprecated.h
      - name: Build application sources with tracing
        if: matrix.language == 'swift'
        # CodeQL traces source compilation; this arena is never used for an App bundle.
        # SwiftBuild's Metal resource compilation fails under the macOS tracer.
        run: scripts/preflight.sh swift build --build-system native --scratch-path .artifacts/build/codeql --arch arm64
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:${{ matrix.language }}
  dependencies:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked development tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: "2026.11.12"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Audit locked Swift and Python dependencies
        run: mise run audit:dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: dependency-audit
          path: .artifacts/quality/python-osv.json
          if-no-files-found: error

  checks:
    name: Static checks
    needs: [lint, codeql, dependencies]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all security checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
        run: |
          [[ "$LINT_RESULT" == success && "$CODEQL_RESULT" == success && "$DEPENDENCIES_RESULT" == success ]]
