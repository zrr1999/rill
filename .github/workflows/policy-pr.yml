name: "Policy - PR"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-message:
    name: PR message
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR body template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/pull_request_template.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read current PR metadata
        id: pr
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        with:
          route: GET /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check PR title
        uses: zendev-lab/zendev/actions/validate-title@91087d4d4e9841aaf8cead8b7c6d294a3db63b10 # v0.4.0
        with:
          text: ${{ fromJSON(steps.pr.outputs.data).title }}
          profile: zendev

      - name: Check PR body
        if: ${{ fromJSON(steps.pr.outputs.data).user.type != 'Bot' }}
        uses: zendev-lab/zendev/actions/validate-body@91087d4d4e9841aaf8cead8b7c6d294a3db63b10 # v0.4.0
        with:
          body: ${{ fromJSON(steps.pr.outputs.data).body }}
