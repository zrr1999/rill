name: "Policy - PR"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  message:
    name: PR message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"

      - name: Check PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          uvx --no-build --from zendev==0.4.0 \
            --with zendev-commit==0.4.0 --with zendev-review==0.4.0 \
            zendev message check --title --profile zendev --text "$PR_TITLE"
          uvx --no-build --from zendev==0.4.0 \
            --with zendev-commit==0.4.0 --with zendev-review==0.4.0 \
            zendev message check --body --text "$PR_BODY"
