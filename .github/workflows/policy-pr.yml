name: "Policy - PR"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  message:
    name: PR message
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"

      - name: Read the PR body template
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${GH_REPO}/contents/.github/pull_request_template.md?ref=${BASE_SHA}" \
            > "$RUNNER_TEMP/pr-body-template.md"

      - name: Check PR title and body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          current_pr="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
          pr_title="$(jq --raw-output '.title' <<< "$current_pr")"
          pr_body="$(jq --raw-output '.body // ""' <<< "$current_pr")"
          uvx --no-build --from zendev==0.4.0 \
            --with zendev-commit==0.4.0 --with zendev-review==0.4.0 \
            zendev message check --title --profile zendev --text "$pr_title"
          uvx --no-build --from zendev==0.4.0 \
            --with zendev-commit==0.4.0 --with zendev-review==0.4.0 \
            zendev message check --body --template "$RUNNER_TEMP/pr-body-template.md" --text "$pr_body"
