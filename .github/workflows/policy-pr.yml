name: "Policy - PR"

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened, synchronize, ready_for_review]
  merge_group:
    branches:
      - main
    types:
      - checks_requested

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-message:
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    name: PR message
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR message policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/pull_request_template.md
            zendev.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read current PR metadata
        id: pr
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        with:
          route: GET /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check PR title
        uses: zendev-lab/zendev/actions/validate-title@66d020624b6d3e318c3e5c26acab29458998b74d # v0.6.0
        with:
          text: ${{ fromJSON(steps.pr.outputs.data).title }}

      - name: Check PR body
        if: ${{ fromJSON(steps.pr.outputs.data).user.type != 'Bot' }}
        uses: zendev-lab/zendev/actions/validate-body@66d020624b6d3e318c3e5c26acab29458998b74d # v0.6.0
        with:
          body: ${{ fromJSON(steps.pr.outputs.data).body }}
