name: "Policy - PR"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  message:
    name: PR message
    runs-on: ubuntu-latest
    steps:
      - name: Read the PR body template
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${GH_REPO}/contents/.github/pull_request_template.md?ref=${BASE_SHA}" \
            > "$RUNNER_TEMP/pr-body-template.md"

      - name: Read current PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          current_pr="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
          metadata="$(jq --compact-output '{title, body: (.body // "")}' <<< "$current_pr")"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

      - name: Check PR title
        uses: zendev-lab/zendev/actions/validate-title@91087d4d4e9841aaf8cead8b7c6d294a3db63b10 # v0.4.0
        with:
          text: ${{ fromJSON(steps.pr.outputs.metadata).title }}
          profile: zendev

      - name: Check PR body
        uses: zendev-lab/zendev/actions/validate-body@91087d4d4e9841aaf8cead8b7c6d294a3db63b10 # v0.4.0
        with:
          body: ${{ fromJSON(steps.pr.outputs.metadata).body }}
          template: ${{ runner.temp }}/pr-body-template.md
