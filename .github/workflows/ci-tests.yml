name: "CI - Tests"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation and change scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app: ${{ steps.scope.outputs.app }}
      performance_workloads: ${{ steps.scope.outputs.performance_workloads }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned uv
        # v10.1.0
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.13.5"

      - name: Build documentation with locked dependencies
        run: uv run --no-build --locked --script scripts/docs.py build

      - name: Install Node.js for Cloudflare validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Validate Cloudflare static assets without deploying
        run: npx --yes --ignore-scripts wrangler@4.136.3 deploy --dry-run

      - name: Install pinned prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: "v0.5.7"

      - name: Run repository quality gates
        run: |
          prek --version
          prek validate-config prek.toml
          prek -c prek.toml run --all-files

      - name: Test evaluation tools without model or provider access
        run: uv run --no-build --locked --project tools pytest tools/tests

      - name: Test CI aggregation and cache policy
        run: python3 scripts/tests/ci_workflow_test.py

      - name: Select the application verification lane
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          app=true
          performance_workloads=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --no-renames -z "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/changed-paths"
            app=false
            performance_workloads=false
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              case "$path" in
                docs/*.md|CONTRIBUTING.md|zensical.toml|wrangler.toml) ;;
                *) app=true ;;
              esac
              case "$path" in
                Sources/RillCore/*|Sources/RillRecords/*|Sources/RillPersistence/*|Benchmarks/*|scripts/build_benchmarks.sh|.github/workflows/ci-tests.yml) performance_workloads=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
            if [[ "$count" == 0 ]]; then app=true; performance_workloads=true; fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "performance_workloads=$performance_workloads" >> "$GITHUB_OUTPUT"

      - name: Install pinned Gitleaks for documentation-only changes
        if: ${{ steps.scope.outputs.app == 'false' }}
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks-bin"
          bash scripts/preflight.sh install-gitleaks --destination "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan secrets for documentation-only changes
        if: ${{ steps.scope.outputs.app == 'false' }}
        run: bash scripts/check_secrets.sh

  preflight-lanes:
    name: Preflight (${{ matrix.lane }})
    needs: docs
    if: ${{ needs.docs.outputs.app == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      # Keep both lanes running so failures retain independent evidence.
      fail-fast: false
      matrix:
        include:
          - lane: tests
            cache-path: .build
          - lane: release
            cache-path: .artifacts/build/release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned uv
        # v10.1.0
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.13.5"

      - name: Install pinned Gitleaks
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks-bin"
          bash scripts/preflight.sh install-gitleaks --destination "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Identify the build toolchain
        id: toolchain
        shell: bash
        run: |
          xcode="$(xcodebuild -version)"
          swift="$(swift --version)"
          sdk="$(xcrun --show-sdk-build-version)"
          metal="$(xcrun metal -v 2>&1)"
          metal_path="$(xcrun -f metal)"
          metal_sha="$(shasum -a 256 "$metal_path" | cut -d ' ' -f 1)"
          # Cryptex mount paths vary across runners; preserve compiler content identity.
          metal="$(printf '%s\n' "$metal" | sed '/^InstalledDir:/d')"
          identity="$(printf '%s\n' "$xcode" "$swift" "$sdk" "$metal" "$metal_sha")"
          printf '%s\n' "$identity"
          key="$(printf '%s' "$identity" | shasum -a 256 | cut -d ' ' -f 1)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Compute lane cache key
        id: cache-key
        env:
          CACHE_PREFIX: swift-v2-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/build_driver.py') }}-
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          echo "prefix=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "primary=${CACHE_PREFIX}${CHECKOUT_SHA}" >> "$GITHUB_OUTPUT"

      # Main/manual runs clean their lane arena; restoring it would only waste time.
      - name: Restore Swift build arena
        if: ${{ github.event_name == 'pull_request' }}
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ steps.cache-key.outputs.primary }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}

      - name: Report lane and cache diagnostics
        if: ${{ always() }}
        env:
          LANE: ${{ matrix.lane }}
          PRIMARY_KEY: ${{ steps.cache-key.outputs.primary }}
          MATCHED_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          RESTORE_OUTCOME: ${{ steps.build-cache.outcome }}
        run: |
          {
            printf 'Lane: %s\n' "$LANE"
            printf 'Checkout SHA: %s\n' "$(git rev-parse HEAD)"
            printf 'Cache primary key: %s\n' "$PRIMARY_KEY"
            printf 'Cache matched key: %s\n' "${MATCHED_KEY:-none}"
            printf 'Cache hit: %s\n' "${CACHE_HIT:-not restored}"
            printf 'Cache restore outcome: %s\n' "$RESTORE_OUTCOME"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve locked SwiftPM dependencies
        run: |
          swift package --force-resolved-versions resolve
          git diff --exit-code -- Package.resolved

      - name: Show toolchain versions
        run: |
          uv --version
          gitleaks version
          swift --version
          sw_vers
          xcodebuild -version
          grep -F '.macOS(.v26)' Package.swift
          uv run --quiet --no-project --python '>=3.11' python --version

      - name: Query live OSV for locked SwiftPM commits
        run: uv run --no-build --locked --script scripts/check_dependency_security.py --live-osv

      - name: Run preflight
        id: lane
        env:
          LANE: ${{ matrix.lane }}
          EVENT_NAME: ${{ github.event_name }}
          RILL_UI_SNAPSHOT_DIR: ${{ github.workspace }}/.artifacts/ui-renders
          RILL_PREFLIGHT_APP_DIR: ${{ github.workspace }}/.artifacts/preflight-app
          RILL_RECORD_STRESS: "1"
          RILL_PREFLIGHT_REPORT_DIR: ${{ runner.temp }}/rill-preflight-${{ matrix.lane }}
          RILL_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RILL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            bash scripts/preflight.sh --lane "$LANE"
          else
            bash scripts/preflight.sh --clean --lane "$LANE"
          fi

      - name: Save native render evidence
        if: ${{ always() && matrix.lane == 'tests' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-renders-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ui-renders/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Save verified preflight app
        if: ${{ success() && matrix.lane == 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-preflight-app-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/preflight-app/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize preflight
        if: ${{ always() }}
        env:
          LANE: ${{ matrix.lane }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP/rill-preflight-$LANE"/run.*/summary.md)
          if [[ "${#reports[@]}" -gt 0 ]]; then
            cat "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No preflight report was produced. Check setup steps and preflight initialization.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preflight reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rill-preflight-${{ matrix.lane }}
          retention-days: 14
          if-no-files-found: ignore

      # Only a completed, trusted lane may seed subsequent PR builds. The key is
      # computed independently because clean runs intentionally skip restore.
      - name: Save successful trusted lane build arena
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.lane.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ steps.cache-key.outputs.primary }}

  record-workloads:
    needs: docs
    if: ${{ needs.docs.outputs.performance_workloads == 'true' }}
    name: Record workload validation
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Validate performance workload correctness
        run: bash scripts/build_benchmarks.sh

  # Preserve the existing required-check name while joining every selected job.
  preflight:
    name: Release preflight
    needs: [docs, preflight-lanes, record-workloads]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all selected verification jobs
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          APP_SCOPE: ${{ needs.docs.outputs.app }}
          PREFLIGHT_RESULT: ${{ needs.preflight-lanes.result }}
          WORKLOAD_SCOPE: ${{ needs.docs.outputs.performance_workloads }}
          WORKLOAD_RESULT: ${{ needs.record-workloads.result }}
        run: bash scripts/check_ci_results.sh
