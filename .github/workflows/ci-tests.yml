name: "CI - Tests"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation and change scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app: ${{ steps.scope.outputs.app }}
      performance_workloads: ${{ steps.scope.outputs.performance_workloads }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned uv
        # v10.1.0
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.17"

      - name: Build documentation with locked dependencies
        run: uv run --no-build --locked --script scripts/docs.py build

      - name: Install Node.js for Cloudflare validation
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Validate Cloudflare static assets without deploying
        run: npx --yes --ignore-scripts wrangler@4.136.3 deploy --dry-run

      - name: Install pinned prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          install-only: true
          prek-version: "0.5.3"

      - name: Run repository quality gates
        run: |
          prek --version
          prek validate-config prek.toml
          prek -c prek.toml run --all-files

      - name: Select the application verification lane
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          app=true
          performance_workloads=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --no-renames -z "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/changed-paths"
            app=false
            performance_workloads=false
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              case "$path" in
                docs/*.md|CONTRIBUTING.md|zensical.toml|wrangler.toml) ;;
                *) app=true ;;
              esac
              case "$path" in
                Sources/RillCore/*|Sources/RillRecords/*|Sources/RillPersistence/*|Benchmarks/*|scripts/build_benchmarks.sh|.github/workflows/ci-tests.yml) performance_workloads=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
            if [[ "$count" == 0 ]]; then app=true; performance_workloads=true; fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "performance_workloads=$performance_workloads" >> "$GITHUB_OUTPUT"

      - name: Install pinned Gitleaks for documentation-only changes
        if: ${{ steps.scope.outputs.app == 'false' }}
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks-bin"
          bash scripts/preflight.sh install-gitleaks --destination "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan secrets for documentation-only changes
        if: ${{ steps.scope.outputs.app == 'false' }}
        run: bash scripts/check_secrets.sh

  preflight:
    name: Release preflight
    needs: docs
    if: ${{ needs.docs.outputs.app == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SWIFT_BUILD_CACHE_PATHS: |
        .build
        .artifacts/build/release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned uv
        # v10.1.0
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.17"

      - name: Install pinned Gitleaks
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks-bin"
          bash scripts/preflight.sh install-gitleaks --destination "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Identify the build toolchain
        id: toolchain
        run: |
          identity="$(xcodebuild -version; swift --version; xcrun --show-sdk-build-version)"
          echo "key=$(printf '%s' "$identity" | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Swift build arenas
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SWIFT_BUILD_CACHE_PATHS }}
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/build_driver.py') }}-${{ github.sha }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/build_driver.py') }}-

      - name: Resolve locked SwiftPM dependencies
        run: |
          swift package --force-resolved-versions resolve
          git diff --exit-code -- Package.resolved

      - name: Show toolchain versions
        run: |
          uv --version
          gitleaks version
          swift --version
          sw_vers
          xcodebuild -version
          grep -F '.macOS(.v26)' Package.swift
          uv run --quiet --no-project --python '>=3.11' python --version

      - name: Query live OSV for locked SwiftPM commits
        run: uv run --no-build --locked --script scripts/check_dependency_security.py --live-osv

      - name: Run preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          RILL_UI_SNAPSHOT_DIR: ${{ github.workspace }}/.artifacts/ui-renders
          RILL_PREFLIGHT_APP_DIR: ${{ github.workspace }}/.artifacts/preflight-app
          RILL_RECORD_STRESS: "1"
          RILL_PREFLIGHT_REPORT_DIR: ${{ runner.temp }}/rill-preflight
          RILL_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RILL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            bash scripts/preflight.sh
          else
            bash scripts/preflight.sh --clean
          fi

      - name: Save native render evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-renders-${{ github.sha }}
          path: .artifacts/ui-renders/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Save verified preflight app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-preflight-app-${{ github.sha }}
          path: .artifacts/preflight-app/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize preflight
        if: ${{ always() }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/rill-preflight/run.*/summary.md)
          if [[ "${#reports[@]}" -gt 0 ]]; then
            cat "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No preflight report was produced. Check setup steps and preflight initialization.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preflight reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rill-preflight
          retention-days: 14
          if-no-files-found: ignore

      - name: Save Swift build arenas
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SWIFT_BUILD_CACHE_PATHS }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  record-workloads:
    needs: docs
    if: ${{ needs.docs.outputs.performance_workloads == 'true' }}
    name: Record workload validation
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - name: Validate performance workload correctness
        run: bash scripts/build_benchmarks.sh
