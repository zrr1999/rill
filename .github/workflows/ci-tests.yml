name: "CI - Tests"

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
    types:
      - checks_requested

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/uv-cache
  PREK_HOME: ${{ github.workspace }}/.artifacts/prek-cache

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
      performance_workloads: ${{ steps.scope.outputs.performance_workloads }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Choose test and packaging scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          app=true
          performance_workloads=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --no-renames -z "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/changed-paths"
            app=false
            performance_workloads=false
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              case "$path" in
                docs/*.md|CONTRIBUTING.md|zensical.toml|wrangler.toml) ;;
                *) app=true ;;
              esac
              case "$path" in
                Sources/RillCore/*|Sources/RillRecords/*|Sources/RillPersistence/*|Benchmarks/*|scripts/build_benchmarks.sh|.github/workflows/ci-tests.yml) performance_workloads=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
            if [[ "$count" == 0 ]]; then app=true; performance_workloads=true; fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "performance_workloads=$performance_workloads" >> "$GITHUB_OUTPUT"

  tool-tests:
    name: Development tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install locked development tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Test evaluation tools without model or provider access
        run: uv run --no-build --locked --project tools pytest tools/tests

  preflight-lanes:
    name: ${{ matrix.name }}
    needs:
      - scope
      - tool-tests
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      # Keep both lanes running so failures retain independent evidence.
      fail-fast: false
      matrix:
        include:
          - lane: tests
            name: macOS tests
            cache-path: .build
          - lane: release
            name: macOS package smoke test
            cache-path: .artifacts/build/release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install locked development tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Identify the build toolchain
        id: toolchain
        shell: bash
        run: |
          key="$(uv run --no-build --script scripts/build_driver.py toolchain-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Compute lane cache key
        id: cache-key
        env:
          CACHE_PREFIX: swift-v2-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{
            hashFiles('Package.swift', 'Package.resolved', 'scripts/build_driver.py', 'scripts/file_input.py') }}-
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          echo "prefix=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "primary=${CACHE_PREFIX}${CHECKOUT_SHA}" >> "$GITHUB_OUTPUT"

      # Merge-group runs build from a clean arena.
      - name: Restore Swift build arena
        if: ${{ github.event_name == 'pull_request' }}
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ steps.cache-key.outputs.primary }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}

      - name: Report lane and cache diagnostics
        if: ${{ always() }}
        env:
          LANE: ${{ matrix.lane }}
          PRIMARY_KEY: ${{ steps.cache-key.outputs.primary }}
          MATCHED_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          RESTORE_OUTCOME: ${{ steps.build-cache.outcome }}
        run: |
          {
            printf 'Lane: %s\n' "$LANE"
            printf 'Checkout SHA: %s\n' "$(git rev-parse HEAD)"
            printf 'Cache primary key: %s\n' "$PRIMARY_KEY"
            printf 'Cache matched key: %s\n' "${MATCHED_KEY:-none}"
            printf 'Cache hit: %s\n' "${CACHE_HIT:-not restored}"
            printf 'Cache restore outcome: %s\n' "$RESTORE_OUTCOME"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve locked SwiftPM dependencies
        run: |
          swift package --force-resolved-versions resolve
          git diff --exit-code -- Package.resolved

      - name: Show toolchain versions
        run: |
          uv --version
          swift --version
          sw_vers
          xcodebuild -version
          grep -F '.macOS(.v26)' Package.swift
          uv run --quiet --no-project --python '>=3.11' python --version

      - name: Check Swift module boundaries and script behavior
        if: ${{ matrix.lane == 'tests' }}
        run: |
          uv run --no-build --script scripts/check_module_boundaries.py
          scripts/test.sh --scripts
          scripts/build_benchmarks.sh --preview-only

      - name: Run test or package smoke check
        id: lane
        env:
          LANE: ${{ matrix.lane }}
          EVENT_NAME: ${{ github.event_name }}
          RILL_PREFLIGHT_APP_DIR: ${{ github.workspace }}/.artifacts/preflight-app
          RILL_PREFLIGHT_REPORT_DIR: ${{ runner.temp }}/rill-preflight-${{ matrix.lane }}
          RILL_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RILL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          flags=()
          if [[ "$EVENT_NAME" != pull_request ]]; then flags+=(--clean); fi
          case "$LANE" in
            tests) scripts/test.sh --desktop --evidence "${flags[@]}" ;;
            release) scripts/package_smoke.sh "${flags[@]}" ;;
            *) echo "::error::Unknown macOS job: $LANE"; exit 2 ;;
          esac

      - name: Save verified Swift build arena
        if: ${{ success() && github.event_name == 'pull_request' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ steps.cache-key.outputs.primary }}

      - name: Save native render evidence
        if: ${{ always() && matrix.lane == 'tests' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-renders-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ui-renders/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Save smoke-tested app
        if: ${{ success() && matrix.lane == 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-preflight-app-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/preflight-app/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize test or packaging report
        if: ${{ always() }}
        env:
          LANE: ${{ matrix.lane }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP/rill-preflight-$LANE"/run.*/summary.md)
          if [[ "${#reports[@]}" -gt 0 ]]; then
            cat "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No test or packaging report was produced. Check setup steps.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and packaging reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rill-preflight-${{ matrix.lane }}
          retention-days: 14
          if-no-files-found: ignore

    if: needs.scope.outputs.app == 'true'
  record-workloads:
    needs:
      - scope
      - tool-tests
    name: Record workload validation
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked development tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Validate performance workload correctness
        run: bash scripts/build_benchmarks.sh

    if: needs.scope.outputs.performance_workloads == 'true'
  # Keep the exact required-check name configured in the main ruleset.
  preflight:
    name: Release preflight
    needs:
      - scope
      - tool-tests
      - preflight-lanes
      - record-workloads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject inconsistent verification scope
        if: >-
          ${{
            (needs.scope.outputs.app != 'true' &&
             (needs.scope.outputs.app != 'false' || needs.preflight-lanes.result != 'skipped')) ||
            (needs.scope.outputs.performance_workloads != 'true' &&
             (needs.scope.outputs.performance_workloads != 'false' || needs.record-workloads.result != 'skipped'))
          }}
        run: echo "::error::Verification scope is invalid or an unselected job did not skip"; exit 1
      - name: Require all selected verification jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{
              format('{0},{1}',
                needs.scope.outputs.app == 'false' && 'preflight-lanes' || '',
                needs.scope.outputs.performance_workloads == 'false' && 'record-workloads' || '')
            }}
    if: ${{ always() }}
  coverage:
    name: Coverage
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked development tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Collect Python and Swift domain coverage
        run: mise run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: domain-coverage
          path: .artifacts/quality/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload measured coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .artifacts/quality/swift.lcov,.artifacts/quality/python-coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

  preview-simulation:
    name: Record preview CPU simulation
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: "6.2.1"
      - name: Build and validate preview workloads
        run: bash scripts/build_benchmarks.sh --codspeed --preview-only
      - name: Measure CPU simulation with CodSpeed
        uses: CodSpeedHQ/action@b1f28b5eccf7cb5bfe6a2a89cb3053eb67f1150c # v5.8.0
        with:
          mode: simulation
          runner-version: "5.6.0"
          run: .artifacts/benchmarks/record-text
    needs: scope
    if: needs.scope.outputs.performance_workloads == 'true'
