name: "CI - Performance"

on:
  pull_request:
    paths:
      - Sources/RillCore/**
      - Sources/RillRecords/**
      - Sources/RillPersistence/**
      - Benchmarks/**
      - scripts/build_benchmarks.sh
      - .github/workflows/ci-performance.yml
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-simulation:
    name: Record preview CPU simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: "6.2.1"
      - name: Build and validate preview workloads
        run: bash scripts/build_benchmarks.sh --codspeed --preview-only
      - name: Measure CPU simulation with CodSpeed
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          runner-version: "5.6.0"
          run: .artifacts/benchmarks/record-text
