name: "CI - Performance"

on:
  pull_request:
    paths:
      - Sources/RillCore/**
      - Sources/RillRecords/**
      - Sources/RillPersistence/**
      - Benchmarks/**
      - scripts/build_benchmarks.sh
      - .github/workflows/ci-performance.yml
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-simulation:
    name: Record preview CPU simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: SwiftyLab/setup-swift@9014d4136569075c696d4151c7810ecde8712907 # v1.14.1
        with:
          swift-version: "6.2.1"
      - name: Build and validate preview workloads
        run: bash scripts/build_benchmarks.sh --codspeed --preview-only
      - name: Measure CPU simulation with CodSpeed
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: .artifacts/benchmarks/record-text
