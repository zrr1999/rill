name: Coverage

on:
  workflow_call:

permissions: {}

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/uv-cache
  PREK_HOME: ${{ github.workspace }}/.artifacts/prek-cache

jobs:
  coverage:
    name: Coverage
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked development tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Collect Python and Swift domain coverage
        run: mise run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: domain-coverage
          path: .artifacts/quality/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload measured coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .artifacts/quality/swift.lcov,.artifacts/quality/python-coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
