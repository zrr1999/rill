name: "CE - Quality"

on:
  schedule:
    - cron: "30 1 * * 1" # Monday 09:30 Asia/Shanghai (UTC+8)
  workflow_dispatch:
    inputs:
      suite:
        description: Quality evaluation suite (sends fixed synthetic cases to the configured provider)
        type: choice
        required: true
        default: all
        options:
          - all
          - text-rewrite
          - vocabulary-correction
          - context-correction

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/uv-cache
  PREK_HOME: ${{ github.workspace }}/.artifacts/prek-cache

permissions:
  contents: read

jobs:
  evaluate:
    name: Quality evaluation (${{ matrix.suite }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((github.event_name == 'schedule' || inputs.suite == 'all') && '["text-rewrite","vocabulary-correction","context-correction"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked development tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.11.0"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Run the selected quality evaluation
        env:
          EVALUATION_SUITE: ${{ matrix.suite }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: uv run --no-build --locked --project tools rill-eval-quality "$EVALUATION_SUITE"
      - name: Save content-free quality and performance summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ matrix.suite }}-${{ github.sha }}
          path: .artifacts/evals/**/summaries/*-report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
