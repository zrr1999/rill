name: "Policy - PR Title"

on:
  # Read PR metadata and default-branch TOML without checking out PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Policy - PR"]
    types: [completed]

permissions: {}

concurrency:
  group: policy-pr-title-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  title:
    name: Normalize PR title
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Normalize the title and rerun PR policy
        uses: zendev-lab/zendev/actions/normalize-title@66d020624b6d3e318c3e5c26acab29458998b74d # v0.6.0
