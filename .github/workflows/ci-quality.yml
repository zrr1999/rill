name: "CI - Quality"

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage and Sonar Analysis
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - name: Collect Python and Swift domain coverage
        id: coverage
        run: just coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: domain-coverage
          path: .artifacts/quality/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload measured coverage
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5.5.3
        with:
          files: .artifacts/quality/swift.lcov,.artifacts/quality/python-coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      - name: Analyze application and helper sources
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependencies:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Audit locked Swift revisions
        run: uv run --no-build --locked --script scripts/check_dependency_security.py --live-osv
      - name: Install verified OSV-Scanner
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 --output "$RUNNER_TEMP/osv-scanner"
          printf '%s  %s\n' '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b' "$RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Audit all Python project and script locks
        run: |
          arguments=(--lockfile tools/uv.lock)
          while IFS= read -r -d '' path; do
            arguments+=(--lockfile "uv.lock:$path")
          done < <(git ls-files -z 'scripts/*.py.lock' 'scripts/**/*.py.lock')
          "$RUNNER_TEMP/osv-scanner" scan source "${arguments[@]}" --format json --output-file python-osv.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: dependency-audit
          path: python-osv.json
          if-no-files-found: error

  reports:
    name: Mutation Structure and Links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - run: just mutation
      - run: just reports
        if: ${{ !cancelled() }}
      - run: just links
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: quality-reports
          path: |
            .artifacts/quality/*.json
            .artifacts/quality/*.xml
            .artifacts/quality/*.log
            .artifacts/quality/jscpd/
            tools/mutants/mutmut-cicd-stats.json
          include-hidden-files: true
          if-no-files-found: error

  workflow-audit:
    name: Online Workflow Audit
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Audit action provenance and references
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-build --from jactionlint==2.3.0 --with shellcheck-py==0.11.0.1 --with pyflakes==3.4.0 bash scripts/check_workflows.sh --online=strict --online-report=workflow-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: workflow-audit
          path: workflow-audit.json
          if-no-files-found: error
