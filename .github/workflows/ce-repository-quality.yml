name: CE - Repository Quality
on:
  schedule:
    - cron: 30 1 * * 1
  workflow_dispatch:
env:
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/uv-cache
  PREK_HOME: ${{ github.workspace }}/.artifacts/prek-cache

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked development tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.11.0"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Audit locked Swift revisions
        run: mise run audit:swift
      - name: Audit all Python project and script locks
        run: mise run audit:python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: dependency-audit
          path: .artifacts/quality/python-osv.json
          if-no-files-found: error

  workflow-audit:
    name: Online Workflow Audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked development tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.11.0"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Audit action provenance and references
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-build --from jactionlint==2.4.0 --with shellcheck-py==0.11.0.1 --with ruff==0.17.1 bash
          scripts/check_workflows.sh --online=strict --online-report=workflow-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: workflow-audit
          path: workflow-audit.json
          if-no-files-found: error
  reports:
    name: Structure and External Links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked development tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.11.0"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - shell: bash
        run: |
          mise run quality:duplication
          mise run quality:complexity
        if: ${{ !cancelled() }}
      - shell: bash
        run: |
          git ls-files -z '*.md' ':(exclude).agents/notes/**' | xargs -0 uvx --from lychee-bin==0.24.2 lychee --scheme https --scheme http --exclude '^https://github.com/zrr1999/rill/settings/' --timeout 20 --max-retries 1 --no-progress --format json --output .artifacts/quality/links.json
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: quality-reports
          path: |
            .artifacts/quality/
          include-hidden-files: true
          if-no-files-found: error
  coverage:
    name: Coverage
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked development tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.11.0"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Collect Python and Swift domain coverage
        run: mise run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: domain-coverage
          path: .artifacts/quality/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload measured coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .artifacts/quality/swift.lcov,.artifacts/quality/python-coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

  preview-simulation:
    name: Record preview CPU simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: "6.2.1"
      - name: Build and validate preview workloads
        run: bash scripts/build_benchmarks.sh --codspeed --preview-only
      - name: Measure CPU simulation with CodSpeed
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          runner-version: "5.6.0"
          run: .artifacts/benchmarks/record-text
  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked development tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.11.0"

      - name: Restore Python and hook caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/uv-cache
            .artifacts/prek-cache
          key: python-hooks-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'prek.toml', '**/uv.lock', 'scripts/**/*.py.lock') }}

      - name: Run mutation tests
        run: mise run quality:mutation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: |
            .artifacts/quality/mutation.log
            tools/mutants/mutmut-cicd-stats.json
          include-hidden-files: true
          if-no-files-found: error
