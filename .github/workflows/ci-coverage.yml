name: CI - Coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    name: Collect and upload
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - name: Collect Python and Swift domain coverage
        run: just coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: domain-coverage
          path: .artifacts/quality/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload measured coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .artifacts/quality/swift.lcov,.artifacts/quality/python-coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
