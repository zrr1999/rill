[project]
name = "rill-dev"
version = "0.0.0"
description = "Internal development tools for the Rill checkout"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.scripts]
rill-accept-asr = "rill_dev.evaluation.asr_acceptance:main"
rill-bench-asr = "rill_dev.evaluation.asr_performance:main"
rill-eval-quality = "rill_dev.evaluation.quality:main"
rill-replay-asr = "rill_dev.evaluation.asr_replay:main"
rill-replay-product = "rill_dev.evaluation.product_replay:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17", "ty>=0.0.69"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rill_dev"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src"]

[tool.uv]
no-build = true
