[project]
name = "rill-dev"
version = "0.0.0"
description = "Internal development tools for the Rill checkout"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.scripts]
rill-accept-asr = "rill_dev.evaluation.asr_acceptance:main"
rill-bench-asr = "rill_dev.evaluation.asr_performance:main"
rill-eval-quality = "rill_dev.evaluation.quality:main"
rill-replay-asr = "rill_dev.evaluation.asr_replay:main"
rill-replay-product = "rill_dev.evaluation.product_replay:main"

[dependency-groups]
dev = ["deptry==0.25.1", "hypothesis==6.170.12", "import-linter==2.15", "pytest>=8", "pytest-cov==7.0.0", "ruff>=0.17", "ty>=0.0.69"]
quality = ["mutmut==3.8.0", "radon==6.0.1"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["rill_dev"]
branch = true
relative_files = true

[tool.importlinter]
root_package = "rill_dev"

[[tool.importlinter.contracts]]
name = "Build metadata stays independent of evaluation policy"
type = "forbidden"
source_modules = ["rill_dev.repository"]
forbidden_modules = ["rill_dev.evaluation"]

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/rill_dev/evaluation/asr_quality.py"]
pytest_add_cli_args_test_selection = ["tests/test_asr_distance.py", "tests/test_asr_analysis.py"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rill_dev"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src"]

[tool.uv]
no-build = true
